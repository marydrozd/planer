<html lang="ru"><head><meta charset="utf-8">

<title>mary.exe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#fbf9fa;--surface:#fff;--chrome:#efedee;--line:#cfc6c4;--ink:#5a4540;--soft:#9a8c88;--accent:#ead9ef;--strong:#b99ac4}
@media (prefers-color-scheme:dark){:root{--bg:#1f1a19;--surface:#2a2321;--chrome:#342c2a;--line:#4c403d;--ink:#f1e6e3;--soft:#a8988f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left))}
.win{width:100%;max-width:380px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.bar{background:var(--chrome);border-bottom:1.5px solid var(--line);padding:8px 12px;display:flex;gap:6px;align-items:center;position:relative}
.d{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}.d:nth-child(1){background:var(--ink)}.d:nth-child(3){background:var(--accent)}
.t{position:absolute;left:50%;transform:translateX(-50%);color:var(--soft);font-size:14px}
form{padding:20px;display:flex;flex-direction:column;gap:12px}
h1{font-family:"Pixelify Sans",monospace;margin:0;font-size:30px;line-height:1}
p{margin:0;color:var(--soft);font-size:14px}
input[type=password]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px}
label{font-size:14px;display:flex;gap:8px;align-items:center}
button{font:inherit;font-weight:600;border:1.5px solid var(--soft);background:var(--accent);color:#5a4540;border-radius:14px;padding:12px}
.err{color:#c0634a;font-size:14px;min-height:1em}
</style></head><body>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K='planner-key-'+D.s.slice(0,8);
async function open_(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
async function derive(p){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,256));}
if(location.hash==='#logout'){try{localStorage.removeItem(K)}catch(e){}}
try{const s=localStorage.getItem(K);if(s)open_(u(s)).catch(()=>localStorage.removeItem(K))}catch(e){}
document.getElementById('f').addEventListener('submit',async ev=>{ev.preventDefault();const e=document.getElementById('e');e.textContent='Открываю…';
  const rem=document.getElementById('rm').checked;let raw;
  try{raw=await derive(document.getElementById('pw').value);
    const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  }catch(x){e.textContent='Неверный пароль';return}
  if(rem){try{localStorage.setItem(K,btoa(String.fromCharCode(...raw)))}catch(x){}}
  open_(raw);});
